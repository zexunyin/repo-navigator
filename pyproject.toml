[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-navigator"
version = "0.1.0"
description = "Portable, incremental code navigation for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["tree-sitter>=0.22,<1", "tree-sitter-cpp>=0.22,<1"]

[project.scripts]
repo-nav = "repo_navigator.cli:main"

[tool.setuptools.packages.find]
include = ["repo_navigator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
